# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]
  # Lets a publish be retried against an existing tag without deleting and
  # recreating its release: `gh workflow run publish-npm.yml --ref v3.0.0`
  # publishes exactly the tagged content.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.10
        env:
          CLICKHOUSE_USER: user
          CLICKHOUSE_PASSWORD: password
          CLICKHOUSE_DB: test_db
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q localhost:8123 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for ClickHouse
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8123/ping; then break; fi
            echo "Waiting for ClickHouse..."
            sleep 1
          done

      - run: npm ci
      - run: USE_NOOP_LOGGER=true npm test
      - run: npm run build
      

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for short-lived publish credentials, so
      # there is no long-lived NPM_TOKEN to expire, be scoped wrongly, or need an OTP
      # in CI. `packages: write` is gone with it; that governs GitHub Packages, not
      # the npm registry, so it was never needed.
      #
      # This is NOT what fixed the bare `403 Forbidden - PUT` that blocked 3.0.0 —
      # see the note on the publish step. Trusted publishing is kept because it is
      # the better credential story regardless.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Deliberately NO registry-url. It makes setup-node write an .npmrc holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and inject a literal
      # `XXXXX-XXXXX-XXXXX-XXXXX` placeholder when no token is supplied — so npm
      # authenticates with that garbage instead of exchanging the OIDC token, and
      # fails auth without ever attempting trusted publishing (actions/setup-node
      # #1551). registry.npmjs.org is the default registry anyway, so nothing is lost
      # by omitting it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.x.
      - run: npm install -g npm@latest
      # Records the version actually in use, since trusted publishing is silently
      # unavailable below 11.5.1 and the failure then looks like a credential one.
      - run: npm --version
      - run: npm ci
      - run: npm run build
      # --provenance is free once OIDC is in play, and publishes a signed
      # attestation linking the tarball to this workflow run and commit.
      #
      # If this ever returns a bare `403 Forbidden - PUT` with no npm error message,
      # suspect the payload before the credentials. 3.0.0 was refused that way with a
      # granular token AND with OIDC, and never reached the 2FA challenge, because the
      # 403 came from the Cloudflare WAF in front of registry.npmjs.org — the body was
      # an HTML block page, not an npm response. It matched the SQL-injection payloads
      # the README quoted verbatim while documenting the 3.0.0 fixes. npm relays the
      # README in the publish body, so documentation alone can trip it; keep attack
      # strings in the README written as `<placeholder>` fragments.
      #
      # To tell the two apart, point npm at a local proxy that logs the raw response
      # (`--registry`, with a matching `_authToken` line), and use `--otp=000000` so a
      # payload that gets through is rejected by npm rather than published.
      - run: npm publish --provenance --access public --loglevel=verbose
      # npm writes the full HTTP exchange here and it never reaches the step log.
      - name: Dump npm debug log
        if: failure()
        run: cat /home/runner/.npm/_logs/*-debug-0.log
