# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]
  # Lets a publish be retried against an existing tag without deleting and
  # recreating its release: `gh workflow run publish-npm.yml --ref v3.0.0`
  # publishes exactly the tagged content.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.10
        env:
          CLICKHOUSE_USER: user
          CLICKHOUSE_PASSWORD: password
          CLICKHOUSE_DB: test_db
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q localhost:8123 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for ClickHouse
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8123/ping; then break; fi
            echo "Waiting for ClickHouse..."
            sleep 1
          done

      - run: npm ci
      - run: USE_NOOP_LOGGER=true npm test
      - run: npm run build
      

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      # This replaces NPM_TOKEN entirely: there is no long-lived secret to expire,
      # be scoped wrongly, or trip the account's 2FA-on-write policy — which is
      # what returned a bare `403 Forbidden - PUT` here however the token was
      # rotated. `packages: write` is gone with it; that governs GitHub Packages,
      # not the npm registry, so it was never needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Deliberately NO registry-url. It makes setup-node write an .npmrc holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and inject a literal
      # `XXXXX-XXXXX-XXXXX-XXXXX` placeholder when no token is supplied — so npm
      # authenticates with that garbage instead of exchanging the OIDC token, and
      # returns 403 without ever attempting trusted publishing. registry.npmjs.org
      # is the default registry anyway, so nothing is lost by omitting it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.x.
      - run: npm install -g npm@latest
      # Records the version actually in use, since trusted publishing is silently
      # unavailable below 11.5.1 and the failure then looks like a credential one.
      - run: npm --version
      - run: npm ci
      - run: npm run build
      # --provenance is free once OIDC is in play, and publishes a signed
      # attestation linking the tarball to this workflow run and commit.
      #
      # Verbose so the OIDC exchange is visible: provenance signing uses the
      # `sigstore` audience and succeeds independently of npm auth, so a signed
      # attestation is NOT evidence the registry accepted us. This shows whether a
      # token exchange against npm was attempted at all.
      # TEMPORARY: provenance dropped to isolate whether its validation is what
      # the registry refuses. Restore --provenance once the 403 is understood.
      - run: npm publish --access public --loglevel=verbose
      # npm writes the full HTTP exchange here and it never reaches the step log.
      - name: Dump npm debug log
        if: failure()
        run: cat /home/runner/.npm/_logs/*-debug-0.log
